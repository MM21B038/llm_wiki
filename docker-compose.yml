services:
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wiki_network

  postgres:
    image: postgres:17
    ports:
      - 5432:5432
    volumes:
      - ./postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=llm_wiki
      - POSTGRES_PASSWORD=llm_wiki
      - POSTGRES_DB=llm_wiki
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "llm_wiki"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wiki_network

  mongo:
    image: mongo:8
    environment:
      - MONGO_INITDB_ROOT_USERNAME=kali
      - MONGO_INITDB_ROOT_PASSWORD=kali
    ports:
      - "27017:27017"
    volumes:
      - ./mongo:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wiki_network

  web:
    build: .
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    ports:
      - 8000:8000
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: llm_wiki
      POSTGRES_USER: llm_wiki
      POSTGRES_PASSWORD: llm_wiki
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      MONGO_URI: "mongodb://kali:kali@mongo:27017/?authSource=admin&directConnection=true"
    volumes:
      - ./media:/app/media
    depends_on:
      - redis
      - postgres
      - mongo
    networks:
      - wiki_network

  worker:
    build: .
    command: uv run python manage.py rqworker wiki
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: llm_wiki
      POSTGRES_USER: llm_wiki
      POSTGRES_PASSWORD: llm_wiki
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      MONGO_URI: "mongodb://kali:kali@mongo:27017/?authSource=admin&directConnection=true"
    volumes:
      - ./media:/app/media
    depends_on:
      - redis
      - postgres
      - mongo
      - web
    networks:
      - wiki_network

  worker_retry:
    build: .
    command: uv run python manage.py rqworker wiki wiki_retry
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: llm_wiki
      POSTGRES_USER: llm_wiki
      POSTGRES_PASSWORD: llm_wiki
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      MONGO_URI: "mongodb://kali:kali@mongo:27017/?authSource=admin&directConnection=true"
    volumes:
      - ./media:/app/media
    depends_on:
      - redis
      - postgres
      - mongo
      - web
    networks:
      - wiki_network

networks:
  wiki_network:
    driver: bridge
